services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dks-postgres-dev
    environment:
      POSTGRES_DB: digital_key_system
      POSTGRES_USER: postgres  
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - dks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_key_system"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: dks-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dks-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Node.js API Service - Dockerfile 빌드
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dks-api-dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: digital_key_system
      DB_USER: postgres
      DB_PASSWORD: password
      DB_POOL_MAX: 10
      DB_IDLE_TIMEOUT: 30000
      DB_CONNECTION_TIMEOUT: 10000
      JWT_SECRET: dev-secret-key-change-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - dks-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  dks-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local